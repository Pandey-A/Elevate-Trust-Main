<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        function isExtensionConnectionError(msg) {
          return (
            typeof msg === "string" &&
            (msg.indexOf("Could not establish connection") !== -1 ||
              msg.indexOf("Receiving end does not exist") !== -1 ||
              msg.indexOf("runtime.lastError") !== -1)
          );
        }
        window.addEventListener(
          "unhandledrejection",
          function (event) {
            var reason = event && event.reason;
            var msg = (reason && reason.message) || String(reason || "");
            if (isExtensionConnectionError(msg)) {
              event.preventDefault();
              event.stopPropagation();
            }
          },
          true,
        );
        window.addEventListener(
          "error",
          function (event) {
            var msg = (event && event.message) || "";
            if (isExtensionConnectionError(msg)) {
              event.preventDefault();
              event.stopPropagation();
            }
          },
          true,
        );
      })();
    </script>
